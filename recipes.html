<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes | Food For Thought</title>
  <style>* { box-sizing: border-box; }
:root {
  --paper: #fbf7ec;
  --ink: #203d32;
  --leaf: #38563f;
  --line: #c9c7b5;
  --rust: #98472d;
  color: var(--ink);
  background: var(--paper);
  font-family: "Segoe UI", system-ui, sans-serif;
}
body { margin: 0; }
a { color: inherit; }
button, input { font: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #ad502d; outline-offset: 4px; }
main, header { width: min(76rem, 90%); margin-inline: auto; }
header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 1.4rem 0; border-bottom: 1px solid var(--line);
}
header nav, .bubbles, .pills, .tools { display: flex; flex-wrap: wrap; gap: .65rem; align-items: center; }
.brand, h1, blockquote { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
.brand { font-size: 1.2rem; font-weight: 600; text-decoration: none; }
header nav a { font-size: .93rem; text-decoration: none; padding: .4rem .15rem; }
header nav a[aria-current], header nav a:hover { text-decoration: underline; text-underline-offset: .4rem; }
h1 { font-size: clamp(3.5rem, 8vw, 6.8rem); font-weight: 500; line-height: 1; letter-spacing: -.065em; margin: 0; }
.home {
  background: radial-gradient(ellipse at 20% 82%, #eaeedc, transparent 48%), radial-gradient(ellipse at 84% 20%, #f9e9cf, transparent 55%), var(--paper);
}
.home main { min-height: 100svh; display: grid; place-content: center; justify-items: center; text-align: center; padding-block: 3rem; }
.home h1 { max-width: 12ch; font-size: clamp(4.1rem, 11vw, 10rem); }
.ornament { display: flex; gap: 1rem; align-items: center; color: var(--rust); font: 2.5rem Georgia, serif; margin-bottom: 1.35rem; }
.ornament::before, .ornament::after { content: ""; width: clamp(2.5rem, 8vw, 6rem); height: 1px; background: currentColor; opacity: .6; }
.bubbles { justify-content: center; margin-top: 2.5rem; gap: 1rem; }
.bubbles a { display: inline-flex; align-items: center; gap: 1.65rem; padding: .95rem 1.5rem; border: 1px solid #40553a; border-radius: 99rem; text-decoration: none; background: var(--leaf); color: #fffdf2; font-weight: 600; }
.bubbles a + a { background: #f2dfc5; color: #633d2a; border-color: #bfa180; }
.bubbles a:hover { box-shadow: 0 3px 0 #263c3026; transform: translateY(-2px); }
.section-head { padding: clamp(2rem, 5vw, 4rem) 0 1.75rem; }
.filters { padding: 1.25rem 0; border-block: 1px solid var(--line); }
.search { display: block; width: min(100%, 36rem); border: 1px solid #848c7c; background: #fffdf7; color: var(--ink); padding: .85rem 1.1rem; border-radius: .7rem; }
.tools { margin: 1.15rem 0 .65rem; gap: 1rem; }
.tools strong { margin-right: .3rem; }
.tools button { background: transparent; padding: .25rem 0; border: none; color: var(--leaf); text-decoration: underline; text-underline-offset: .18rem; }
.tools button:disabled { color: #656961; cursor: default; text-decoration: none; }
.pills button { padding: .46rem .95rem; border-radius: 10rem; color: var(--ink); background: transparent; border: 1px solid #8c9888; }
.pills button[aria-pressed="true"] { background: var(--leaf); color: white; border-color: var(--leaf); }
.pills button[aria-pressed="true"]::before { content: "✓"; margin-right: .35rem; }
.status { color: #515c50; font-size: .9rem; margin: 1.25rem 0; }
.grid { display: grid; gap: 1.05rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); padding-bottom: 3rem; }
figure { display: flex; flex-direction: column; margin: 0; border: 1px solid #cbcbbb; border-radius: .95rem; background: #fffdf6; padding: clamp(1.25rem, 2.4vw, 2.15rem); }
figure[hidden] { display: none; }
.mark { font: 3.25rem/.8 Georgia, serif; color: var(--rust); }
blockquote { margin: .3rem 0 1.25rem; font-size: clamp(1.18rem, 1.45vw, 1.48rem); line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
figcaption { font-size: .94rem; font-weight: 600; }
.tags { margin: auto 0 0; padding-top: 1rem; font-size: .8rem; color: #586752; }
.empty { color: #50604f; font: 1.3rem/1.5 Georgia, serif; }
.recipe-card { position: relative; width: 100%; height: 100%; min-height: 8rem; display: grid; align-content: start; gap: .7rem; text-align: left; color: var(--ink); background: #fffdf6; border: 1px solid var(--line); border-radius: .95rem; padding: 1.45rem 3rem 1.5rem 1.45rem; }
.recipe-card:hover { border-color: var(--leaf); background: #f4f3e8; }
.recipe-name, #recipe-title { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; }
.recipe-name { font-size: 1.65rem; line-height: 1.16; }
.kind { font-size: .85rem; font-weight: 600; color: #66533f; }
.open-icon { position: absolute; top: 1.3rem; right: 1.15rem; color: var(--rust); }
#reader { position: fixed; inset: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none; border: 0; padding: 0; background: var(--paper); color: var(--ink); overflow-y: auto; overscroll-behavior: contain; }
body:has(#reader[open]) { overflow: hidden; }
.reader-tools { position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--line); padding: .9rem max(5%, calc((100% - 43rem)/2)); }
.reader-tools button { white-space: nowrap; border: 1px solid var(--leaf); color: var(--ink); background: #fffdf6; border-radius: 2rem; padding: .55rem 1rem; }
.reader-page { width: min(90%,43rem); margin: 2.5rem auto 5rem; }
#recipe-title { font-weight: 500; font-size: clamp(2.5rem, 6vw, 4.2rem); line-height: 1.06; margin: .35em 0 .6em; letter-spacing: -.04em; }
#recipe-body { font-size: 1.06rem; line-height: 1.65; overflow-wrap: anywhere; }
#recipe-body h3 { font: 600 1.65rem Georgia, serif; border-top: 1px solid var(--line); padding-top: 1em; margin: 1.1em 0 .65em; }
#recipe-body p { margin: .5em 0; }
.morning { grid-column: 1 / -1; }
.morning blockquote { white-space: normal; }
.morning .question { font-size: .8em; letter-spacing: .06em; font-weight: bold; margin: 0 0 1em; }
.reading { columns: 20rem; column-gap: 2rem; }
.reading p { break-inside: avoid; margin: 0 0 .85em; }
.reflection { margin-bottom: 0; font-style: italic; }
@media (max-width: 30rem) {
  header { flex-wrap: wrap; }
  .grid { gap: .8rem; }
}
</style>

  <section class="grid" aria-label="Recipes"><article data-categories="Breakfast">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Breakfast</span>
      <span class="recipe-name">Aappam</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>Uradh Dhal 2/3 cup</p>
<p>Dill seeds (Vendhayam) 5 seeds</p>
<p>Bread - 2 slices (Crusts to be trimmed)</p>
<p>Cooked Rice - 3 Tbsps</p>
<p>Coconut milk - 1 tin</p>
<p>Rice Flour - 4 ¾ stainless steel tumblers (need to add correct measurement)</p>
<p>Idli Rava - 3 Tbsps</p>
<p>Sugar - 2 tsp</p>
<p>Salt - ½ tsp</p>
<p>Baking powder - pinch</p>
<h3>Method</h3>
<p>Soak cooked rice - 6-8 hours</p>
<p>Soak Uradh Dhal - 6-8 hours</p>
<p>Grind Uradh Dhal</p>
<p>When half done add cooked rice and soaked bread</p>
<p>Add sugar and grind fine</p>
<p>Mix the following:</p>
<p>½ tin coconut milk</p>
<p>½ a coconut’s water</p>
<p>½ tsp salt</p>
<p>Mixture should be thicker than idli mix</p>
<p>Ferment overnight</p>
<p>Next morning add the other ½ tin coconut milk + and a pinch of baking soda</p>
<p>(Mix should be thinner than Dosai mix)</p>
<p>Make Aappams</p></template>
  </article>
<article data-categories="Desserts">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Desserts</span>
      <span class="recipe-name">Applesauce Cake</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>I box Duncan Hines® Moist Deluxe Butter Recipe Golden Cake Mix</p>
<p>3 large eggs</p>
<p>1 1/3 cups applesauce</p>
<p>1/2 cup butter or margarine</p>
<p>1 tsp ground cinnamon</p>
<p>1/2 cup chopped walnuts</p>
<p>confectioner's sugar</p>
<h3>Method</h3>
<p>Preheat oven to 375 °F.</p>
<p>Grease and flour a 10-inch Bundt® or tube pan.</p>
<p>Combine cake mix, eggs, applesauce, melted butter and cinnamon in large bowl.</p>
<p>Beat at low speed with electric mixer until moistened.</p>
<p>Beat at medium speed for 4 minutes.</p>
<p>Stir in walnuts.</p>
<p>Pour into pan.</p>
<p>Bake at 375 °F for 45 to 55 minutes or until toothpick inserted in center comes out clean.</p>
<p>Cool in pan 25 minutes.</p>
<p>Invert cake onto serving plate.</p>
<p>Cool completely.</p>
<p>Dust with confectioners' sugar.</p>
<p>Variation: Also delicious using chopped pecans instead of walnuts.</p></template>
  </article>
<article data-categories="Desserts">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Desserts</span>
      <span class="recipe-name">Apricot Jell-O Salad</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>I (6oz) box Apricot Jell-O (can be substituted with peach Jell-O)</p>
<p>1 (8 oz) can crushed pineapple</p>
<p>1 (8 oz) container cool whip</p>
<p>1 cup buttermilk</p>
<p>Few cherries (optional)</p>
<h3>Method</h3>
<p>In a saucepan heat crushed pineapple (with syrup) and the Jell-O powder until the Jell-O powder dissolves completely (about a minute)</p>
<p>Pour into a bowl</p>
<p>Add cool whip and buttermilk and blend together</p>
<p>Refrigerate a couple of hours</p>
<p>Garnish with cherries</p>
<p>Serve cold</p></template>
  </article>
<article data-categories="Salads">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Salads</span>
      <span class="recipe-name">Asian Salad</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>Coleslaw - 1 bag</p>
<p>Oriental ramen noodles - 1 package of ( break them up )</p>
<p>Slivered almonds - 8 oz</p>
<p>Sunflower seeds - 8 oz</p>
<p>Dressing:</p>
<p>Canola oil - 1/2 cup</p>
<p>White vinegar - 2 tbsp.</p>
<p>White sugar - 1/4 cup</p>
<p>Seasonings packet from the oriental noodles</p>
<h3>Method</h3>
<p>Combine the dressing ingredients ahead of time. Add the dressing to the remaining salad ingredients just before serving.</p></template>
  </article>
<article data-categories="Vegetarian entrées">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Vegetarian entrées</span>
      <span class="recipe-name">Avial</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>1. 2 lbs assortment of Veggies</p>
<p>Carrots</p>
<p>Peas</p>
<p>Beans</p>
<p>Brinjal</p>
<p>Drumstick</p>
<p>Raw Banana</p>
<p>Any watery veggie like any of the gourds</p>
<p>Add just sufficient water to cover the veggies and boil them with turmeric and salt.</p>
<p>2. coarsely grind the following:</p>
<p>Equivalent of 1 coconut</p>
<p>10 - 12 green chillies</p>
<p>Cumin seeds - 1 tsp</p>
<p>3. Curd 1 cup</p>
<h3>Method</h3>
<p>Boil Vegetables.</p>
<p>Add the items ground in 2 above to the boiled vegetables</p>
<p>Let it come to a boil (do not let it actually boil) turn of the flame</p>
<p>Heat 1 tablespoon oil + mustard seeds and add to the Avial</p></template>
  </article>
<article data-categories="Non-vegetarian entrées">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Non-vegetarian entrées</span>
      <span class="recipe-name">Bacon and Broccoli Quiche</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>Bacon - 4 slices</p>
<p>4 eggs</p>
<p>1 c. half &amp; half</p>
<p>1 c. grated Swiss cheese</p>
<p>2 c. broccoli florets</p>
<p>1/4 tsp salt</p>
<p>1/8 tsp garlic powder</p>
<p>1/8 tsp lemon pepper</p>
<h3>Method</h3>
<p>Preheat oven to 350°F</p>
<p>Cook bacon until crisp and crumbly</p>
<p>Beat eggs with cream and cheese</p>
<p>Stir in broccoli, slat, garlic powder and lemon pepper</p>
<p>Crumble ½ the bacon into the egg mixture</p>
<p>Pour into a 9 inch pie plate</p>
<p>Bake at 350°F for 30 - 35 minutes or until the edge inserted half way between the center and edge comes out clean</p>
<p>Top with remaining bacon</p></template>
  </article>
<article data-categories="Non-vegetarian entrées">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Non-vegetarian entrées</span>
      <span class="recipe-name">Bacon and Mushroom Quiche</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>1 c. shredded Cheddar cheese</p>
<p>1 c. sliced mushrooms</p>
<p>1 c. cooked, crumbled bacon</p>
<p>1/4 c. grated Parmesan cheese</p>
<p>1/4 c. minced onion</p>
<p>1 c. shredded Swiss cheese</p>
<p>1 frozen deep dish pie shell, thawed</p>
<p>5 eggs</p>
<p>1 c. half &amp; half</p>
<p>1/2 tsp. white pepper</p>
<h3>Method</h3>
<p>Place layers of Cheddar cheese, mushrooms, bacon, Parmesan cheese, onion, and Swiss cheese in pie shell. Beat eggs until frothy and add half &amp; half. Season with pepper. Pour custard mixture evenly over pie filling. Place quiche on baking sheet and bake at 350 degrees for 1 hour or until set. Let stand 15 minutes before cutting.</p>
<p>Pie Shell: Bake thawed pie shell at 400 degrees until golden in color (5 minutes). Remove from oven. Cool 3 minutes. Brush with beaten egg white, coating shell and edges. Bake a few seconds longer to seal egg white. Cool before filling.</p></template>
  </article>
<article data-categories="Appetizers">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Appetizers</span>
      <span class="recipe-name">Bacon Cheddar Pinwheels</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>1 can (8 oz) Pillsbury® refrigerated crescent dinner rolls or</p>
<p>1 can (8 oz) Pillsbury® Crescent Recipe Creations® refrigerated seamless dough sheet</p>
<p>2 TBSP ranch dressing</p>
<p>¼ cup cooked real bacon pieces or 4 slices bacon, crisply cooked, crumbled</p>
<p>½ cup finely shredded Cheddar cheese (2 oz)</p>
<p>¼ cup chopped green onions (4 medium)</p>
<h3>Method</h3>
<p>Pre heat oven to 350° F.</p>
<p>If using crescent rolls: Unroll dough; separate into 2 long rectangles. Press each into 12x4-inch rectangle, firmly pressing perforations to seal. If using dough sheet: Unroll dough; cut lengthwise into 2 long rectangles. Press each into 12x4-inch rectangle.</p>
<p>Spread dressing over each rectangle to edges.</p>
<p>Sprinkle each with bacon, Cheddar cheese and onions.</p>
<p>Starting with one short side, roll up each rectangle; press edge to seal. With serrated knife, cut each roll into 8 slices</p>
<p>Place cut side down on ungreased cookie sheet.</p>
<p>Bake 12 to 17 minutes or until edges are deep golden brown.</p>
<p>Immediately remove from cookie sheet.</p>
<p>Serve warm.</p></template>
  </article>
<article data-categories="Appetizers">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Appetizers</span>
      <span class="recipe-name">Bajji</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>Oil - for frying</p>
<p>Kadalai Maavu - 3/4 cup</p>
<p>Rice Flour - 1/4 cup</p>
<p>Baking powder - 1/4 tsp</p>
<p>Chillie Powder - 1/2 tsp</p>
<p>Vegetables - sliced - Potatoes, Raw banana, onions etc</p>
<p>Kesari powder - pinch for coloring</p>
<p>Salt - to taste</p>
<p>Water - Add water a little at a time to get the right consistency</p>
<h3>Method</h3>
<p>Sieve the following:</p>
<p>Kadalai Maavu, Rice Flour, Baking powder, Chillie Powder, Kesari powder and Salt.</p>
<p>Add water to make it a thick batter.</p>
<p>Dip the vegetables in the batter and deep fry.</p>
<p>Serve with coconut chutney, pudhina chutney, hot and sweet chutney or Ketchup.</p></template>
  </article>
<article data-categories="Snacks">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Snacks</span>
      <span class="recipe-name">Bajji</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>Besan flour - 1 cup</p>
<p>Salt - ½ tsp (or to taste)</p>
<p>Chillie powder - ½ tsp</p>
<p>Baking powder - 1/3 tsp</p>
<p>Vegetables - Potatoes/green banana/onion</p>
<p>Kesari powder - 1/3 tsp</p>
<p>Water as needed</p>
<h3>Method</h3>
<p>Sieve salt, baking powder, chillie powder and kesari powder together</p>
<p>Add water and make a thick batter</p>
<p>Dip veggies in the batter and deep fry</p>
<p>Serve with ketchup, coconut chutney or pudina chutney</p></template>
  </article>
<article data-categories="Casseroles">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Casseroles</span>
      <span class="recipe-name">Baked Mac and Cheese</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>16 ounces elbow macaroni (about 3 cups)</p>
<p>3 tablespoons butter or margarine</p>
<p>1 ½ cups milk, divided</p>
<p>2 large eggs, lightly beaten</p>
<p>1 lb (16-ounces) cubed (1/2 inch size) Velveeta cheese</p>
<p>8 ounce shredded Kraft Mild Cheddar Cheese (about 2 cups), divided</p>
<p>8 ounce shredded Kraft Monterrey Jack Cheese</p>
<p>1 teaspoon salt</p>
<p>1 teaspoon freshly ground black pepper</p>
<h3>Method</h3>
<p>Heat oven to 375 degrees F.</p>
<p>1. Cook macaroni in a large pot of salted boiling water until tender but not mushy, about 8-10 minutes. Drain well and pour into a large mixing bowl.</p>
<p>2. Melt the Velvetta Cheese and ¾ cup milk on low heat until melted (stir often)</p>
<p>3. Pour Melted Cheese Sauce over Pasta and Stir. Add in butter, ¾ cups milk, eggs, 1 cup shredded cheeses, salt and pepper. Mix well and transfer to a 9X13 pan. Pour the remaining cheese on top.</p>
<p>Bake until top crust is golden brown and casserole is bubbling, about 25 minutes. Serve hot</p></template>
  </article>
<article data-categories="Non-vegetarian entrées">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Non-vegetarian entrées</span>
      <span class="recipe-name">Baked Tandoori Chicken</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>Oil - 2/3 cup</p>
<p>Chicken - 1 Bag frozen Tender loins from COSTCO</p>
<p>Chillie pwder - 2 tsp</p>
<p>Ginger - 1 tsp</p>
<p>Garlic - 1 tsp</p>
<p>Yoghurt - 3 Tbsp</p>
<p>Crushed Pepper sauce - 3 tsp</p>
<p>Salt 1 ½ tsp</p>
<p>Tandoori Chicken powder - 2 tsp</p>
<h3>Method</h3>
<p>Marinate the above overnight</p>
<p>Bake at 350°F for 45 minutes (15 +15 +15)</p>
<p>(Turn every 15 minutes)</p>
<p>Broil for the last 15 minutes</p>
<p>Suitable for non-Indian guests</p></template>
  </article>
<article data-categories="Pasta">
    <button type="button" class="recipe-card" aria-haspopup="dialog">
      <span class="kind">Pasta</span>
      <span class="recipe-name">Baked Ziti</span><span class="open-icon" aria-hidden="true">↗</span>
    </button>
    <template><h3>Ingredients</h3>
<p>Uncooked Ziti - 3 cups ( 8 oz)</p>
<p>Ground Beef or Sausage - ¾ lb</p>
<p>Spaghetti Sauce - 28 oz jar</p>
<p>Ricotta Cheese - 15 oz (1 ¾ cups)</p>
<p>Mozzarella Cheese - 8 oz - 2 cups (shredded)</p>
<p>Dried Basil leaves - 1 tsp</p>

<p>Grind together to a smooth paste</p>
<p>Masala 3:</p>
<p>½ cup grated coconut</p>
<p>3 tsp chopped cashew nuts</p>
<p>½ cup yogurt</p>
<p>Grind together to a smooth paste</p>
<p>Hard boiled eggs for decoration</p>
<h3>Method</h3>
<p>For Rice:</p>
<p>Soak the rice in water for 20 minutes, drain and keep aside</p>
<p>Heat ghee, add the remaining spices for rice preparation and fry for 1 minute.</p>
<p>Add rice and fry further 2 to 3 minutes.</p>
<p>Add water, salt and cook till the water is absorbed. Allow rice to cool.</p>
<p>For Mutton:</p>
<p>Clean the meat, cut into pieces and soak in the yogurt</p>
<p>Heat ghee, add spices, chopped green chilies and onions and fry till mixture turns brown. also add masala 1 and 2 stir well.</p>
<p>Now add the tomatoes and fry for 2 minutes</p>
<p>Then add mutton pieces, coriander and mint leaves and simmer for 5 minutes. Add ½ cup of water and salt to taste.</p>
<p>Cook for 15 minutes and add masala 3. Cook till the gravy becomes thick.</p>
<p>Arranging the Biriyani:</p>
<p>Divide rice into 3 parts and mutton into 2 parts</p>
<p>Grease a dish and arrange alternate layers of meat and rice and meat, beginning and</p>
<p>ending with rice.</p>
<p>Dissolve a little saffron or yellow coloring in ¼ cup of milk.</p>
<p>Pour over rice, cover and bake for 20 to 30 minutes.</p>
<p>Transfer to a serving dish and garnish with fried onions, cashew nuts, raisins and hardboiled eggs.</p></template>
  </article>

    <template><h3>Ingredients</h3>
<p>For the meat sauce:</p>
<p>Italian sausage -1 pound and Lean ground beef - 1 pound</p>
<p>Mushrooms - 8 oz - chopped and Onion -1 - diced</p>
<p>Garlic 4 cloves - minced</p>
<p>Marina sauce - 6 cups and Water - 1/2 cup</p>
<p>Salt - 1 1/2 teaspoon and Black pepper - 1/2 freshly ground</p>
<p>Red pepper flakes 1/4 teaspoon and Italian dried herb blend - 1/2 tspn.</p>
<p>For the cheese filling:</p>
<p>Eggs – 2 - beaten</p>
<p>Ricotta cheese - 2 lbs and Mozzarella cheese 8 oz - shredded</p>
<p>Reggiano-Parmigiano - 2/3 cup freshly grated (substitute Pecorino Romano)</p>
<p>Parsley (fresh) - 1/4 cup chopped and Salt - 1 teaspoon</p>
<p>Black pepper - 1/4 teaspoon -freshly ground and Cayenne - Big pinch</p>
<p>The rest:</p>
<p>lasagna noodles -1 lb (about 18)</p>
<p>Mozzarella cheese - 8 oz torn Shredded Mozzarella</p>
<p>Parmesan cheese 1/2 cup - grated - to top the Lasgna</p>
<h3>Method</h3>
<p>In a heavy skillet or Dutch oven, add the olive oil and cook the sausage, beef, mushrooms, onions, and garlic over medium-high heat until the meat is browned, and the onions have softened. Add the marinara sauce, and the seasonings. Bring up to a simmer reduce the heat to Medium, and cook, uncovered, for 1 hour, stirring occasionally. Add a splash of water when needed if the sauce is getting to dry.</p>
<p>Add all the ingredients for the cheese filling to a mixing bowl. Boil the lasagna noodles one minute less than the directions state. Drain and hold in cold water until needed.</p>
<p>Preheat oven to 375 degrees F. Spread 2 cups of the meat sauce into a 15&quot; x 10&quot; lasagna pan. Top with 1/3 of the noodles. Spread over 1/2 of the cheese mixture. Ladle over 2 cups of the meat sauce. Repeat this layer. Finish with the last of the noodles over the top. Spread over the rest of the sauce, and top with the mozzarella and Parmesan cheese.</p>
<p>Cover with foil. Bake, covered for 35 minutes. Remove foil and bake another 35-40 minutes, or until bubbly and browned. Let rest at least 15 minutes before serving.</p></template>
  </article>

<article data-categories="Desserts">

    </button>
    <template><h3>Ingredients</h3>
<p>1 (18.25-ounce) box plain yellow cake mix, prepared according to package directions</p>
<p>1 (14-ounce) can sweetened condensed milk</p>
<p>1 (12-ounce) can evaporated milk</p>
<p>1 cup whole milk</p>
<p>1 pint whipping cream (see note)</p>
<p>2 tablespoons powdered sugar (see note)</p>
<h3>Method</h3>
<p>Prepare the cake mix according to package directions, adding the ingredients specified on the box. Prepare a 9x13-inch baking pan and bake the cake, again according to package directions, until done, about 30 minutes.</p>
<p>When cake is done, remove it from the oven. While the cake is still warm, using a toothpick or wooden skewer, prick the cake all over (about every ½ inch). In a large glass measuring cup, stir together the condensed milk, evaporated milk and whole milk, and slowly pour over the top of the cake, making sure to distribute it evenly. (The cake should absorb all of the milk if it is poured slowly.)</p>
<p>Allow the cake to sit at room temperature for about 30 minutes to cool. Cover with plastic wrap or foil, and refrigerate for 30 minutes to an hour or until well chilled.</p>
<p>Whip the cream, adding the powdered sugar slowly, until stiff peaks form, about 3 minutes using an electric handheld mixer. Spread the whipped cream over the entire cake and place back in the refrigerator for another hour to chill thoroughly or up to 12 hours before slicing and serving.</p>
<p>Note: Can substitute 1 pint whipping cream and powdered sugar with cool whip.</p>
<p>Can add ½ cup coconut milk and reduce ½ cup whole milk to make it a coconut cake. Garnish with Angels coconut flakes (sweet moistened flakes)</p></template>

  <dialog id="reader" aria-labelledby="recipe-title">
    <div class="reader-tools"><button id="close-recipe" type="button" autofocus>← Back to recipes</button></div>
    <article class="reader-page">
      <p class="kind" id="recipe-category"></p>
      <h2 id="recipe-title"></h2>
      <div id="recipe-body"></div>
    </article>
  </dialog></main>
  <script>const search = document.querySelector('#search');
const pills = [...document.querySelectorAll('.pills button')];
const cards = [...document.querySelectorAll('.grid [data-categories]')];
const noun = document.body.classList.contains('recipes') ? 'recipe' : 'quote';
const selectAll = document.querySelector('#select-all');
const clear = document.querySelector('#clear');
const status = document.querySelector('#status');
const normalize = text => text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim();
const entries = cards.map(card => ({
  card,
  text: normalize(card.querySelector('blockquote')?.textContent ??
    card.querySelector('.recipe-name').textContent + ' ' + card.querySelector('template').content.textContent),
  categories: card.dataset.categories.split('|')
}));

function update() {
  const selected = new Set(pills.filter(pill => pill.getAttribute('aria-pressed') === 'true').map(pill => pill.value));
  const words = normalize(search.value).split(' ').filter(Boolean);
  let count = 0;
  for (const { card, text, categories } of entries) {
    const matches = categories.some(category => selected.has(category)) && words.every(word => text.includes(word));
    card.hidden = !matches;
    if (matches) count++;
  }
  selectAll.disabled = selected.size === pills.length;
  clear.disabled = selected.size === 0;
  if (!selected.size) status.textContent = `Select a category to see ${noun}s.`;
  else if (!count) status.textContent = `No matching ${noun}s. Try another keyword or category.`;
  else status.textContent = `${count} ${noun}${count === 1 ? '' : 's'}`;
}

function setAll(value) {
  for (const pill of pills) pill.setAttribute('aria-pressed', value);
  update();
}
for (const pill of pills) {
  pill.addEventListener('click', () => {
    pill.setAttribute('aria-pressed', pill.getAttribute('aria-pressed') !== 'true');
    update();
  });
}
selectAll.addEventListener('click', () => setAll(true));
clear.addEventListener('click', () => setAll(false));
search.addEventListener('input', update);
update();

const reader = document.querySelector('#reader');
document.querySelector('.grid').addEventListener('click', event => {
  const button = event.target.closest('.recipe-card');
  if (!button) return;
  document.querySelector('#recipe-title').textContent = button.querySelector('.recipe-name').textContent;
  document.querySelector('#recipe-category').textContent = button.querySelector('.kind').textContent;
  document.querySelector('#recipe-body').replaceChildren(button.parentElement.querySelector('template').content.cloneNode(true));
  reader.showModal();
  reader.scrollTop = 0;
});
document.querySelector('#close-recipe').addEventListener('click', () => reader.close());
</script>
